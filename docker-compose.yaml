services:
  app:
    build:
      context: .
      dockerfile: dockerfile

    container_name: homely-hub

    ports:
      - "3000:3000"

    environment:
      NODE_ENV: production
      PORT: 3000
      MONGO_URL: mongodb://mongo:27017/NORMAL

    depends_on:
      - mongo

    restart: unless-stopped

    networks:
      - homely-network

  mongo:
    image: mongo:7

    container_name: homely-mongo

    ports:
      - "27017:27017"

    volumes:
      - mongo-data:/data/db

    restart: unless-stopped

    networks:
      - homely-network

volumes:
  mongo-data:

networks:
  homely-network:
    driver: bridge